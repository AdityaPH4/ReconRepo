version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci --prefix "$(git rev-parse --show-toplevel)"
        build:
          commands:
            - npm run build:packages --prefix "$(git rev-parse --show-toplevel)"
            - npm run build --workspace=apps/web
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
